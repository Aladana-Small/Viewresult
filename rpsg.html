<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors Game</title>
  
  <link rel="stylesheet" href="rpsg.css">
  
</head>

<body>
  <div>
    <h1>
      Rock Paper Scissors 
    </h1>
    <p>
      Pick any of the move below to play game
    </p>
  </div>
  
  <div class="gameButton">
    <button onclick="
      gamePlay('rock')
    ">
      ROCK
    </button>
    <button onclick="
      gamePlay('paper') 
    ">
      PAPER
    </button>
    <button onclick="
      gamePlay('scissors') 
    ">
      SCISSORS
    </button>
    
    <div class="displayScreen">
      <p class="js-show-move">
      
      </p>
      <p class="js-show-result">
      
      </p>
    </div>
    
    <div>
      <button onclick=" 
        resetScore()" 
      class="resetScore">
        Reset Score
      </button>
    </div>
  </div>
  
  <script type="text/javascript" charset="utf-8" src="rpsg.js">
    
  </script>
</body>

</html>
